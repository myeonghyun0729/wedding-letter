<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>청첩장</title>
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #fdf6f0;
      text-align: center;
      padding: 50px;
    }
    .card {
      background: #fff;
      border: 2px solid #e0c097;
      border-radius: 10px;
      padding: 40px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #b68973;
    }
    .details {
      margin-top: 20px;
      font-size: 18px;
      line-height: 1.6;
    }
    .footer {
      margin-top: 30px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>결혼식에 초대합니다</h1>
    <p class="details">
      신랑 <strong>홍길동</strong> ❤️ 신부 <strong>김영희</strong><br><br>
      일시: 2026년 11월 15일 (일) 오후 2시<br>
      장소: 서울 강남구 ○○웨딩홀 3층
    </p>
    <div class="footer">
      함께해 주시면 큰 기쁨이 되겠습니다.
    </div>
  </div>
</body>
</html>
